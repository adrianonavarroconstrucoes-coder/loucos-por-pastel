<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutorial narrado · Loucos por Pastel</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: o próprio trailer explicando o app, animado e direto
   IDEA: uma tela de celular contando o passo a passo, como um story narrado
   PICTURE: os quadros do tutorial em 9:16 no centro
   COLOUR and TYPE: amarelo, preto e vermelho do cardápio; Anton e Oswald
   LAYOUT: quadro grande, controles logo abaixo, lista de capítulos ao lado no computador */
:root{color-scheme:light dark;--y:#f7b500;--k:#141110;--red:#d8431a;--bg:light-dark(#f2ede2,#0e0c0b);--card:light-dark(#fff,#1d1815);--ink:light-dark(#1d1612,#f5eee4);--mut:light-dark(#6f645b,#a99d91);--line:light-dark(#e3d9ca,#342b25)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Oswald,"Arial Narrow",system-ui,sans-serif;overflow-x:clip}
button,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
header{background:var(--y);color:var(--k);display:flex;align-items:center;gap:12px;padding:10px max(4vw,14px);box-shadow:0 2px 0 var(--k)}
header img{width:48px;height:48px;border-radius:50%;border:2px solid var(--k)}
header h1{margin:0;font:400 clamp(20px,4vw,28px)/1.05 Anton,Impact,sans-serif;color:#6e1b0b}
header small{display:block;font-weight:600;font-size:13px;text-transform:uppercase}
.wrap{max-width:1100px;margin:0 auto;padding:18px max(4vw,14px) 40px;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}
.stage{position:relative;aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:var(--k);box-shadow:0 12px 30px rgba(0,0,0,.3)}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.bar{height:6px;background:var(--line);border-radius:99px;margin:12px 0 10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.b{min-height:48px;min-width:48px;border:0;border-radius:12px;background:var(--k);color:var(--y);font-weight:700;cursor:pointer;padding:0 14px;font-size:18px}
.b.main{background:var(--red);color:#fff;flex:1;font-size:17px;text-transform:uppercase;box-shadow:0 4px 0 #6e1b0b}
.opts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px;flex:1}
select{height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);padding:0 10px;font-size:16px}
.now{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.now b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:22px;color:var(--red)}
.note{font-size:14px;color:var(--mut);margin-top:10px}
h2{font:400 26px/1.1 Anton,Impact,sans-serif;margin:0 0 10px}
ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ol button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;cursor:pointer}
ol button span{font-family:Anton,Impact,sans-serif;color:var(--mut);min-width:26px}
ol button.on{background:var(--k);color:#fff;border-color:var(--k)}ol button.on span{color:var(--y)}
@media(max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}.stage{max-width:420px;margin:0 auto;width:100%}}
@media(prefers-reduced-motion:reduce){.stage img,.bar i{transition:none}}
</style></head><body>

<script>

const SC=[{"t": "Abertura", "f": "frames/s00.jpg", "x": "Bem-vindo ao app do Loucos por Pastel! Em poucos minutos você vai aprender a usar a comanda do garçom, a tela da cozinha e a área do administrador."}, {"t": "Acesso · Primeiro acesso", "f": "frames/s01.jpg", "x": "No primeiro acesso, o dono toca em Primeiro acesso e cria duas senhas: uma do administrador, só sua, e uma da equipe, para garçons e cozinha."}, {"t": "Acesso · Entrar", "f": "frames/s02.jpg", "x": "Em cada celular, escolha Equipe ou Administrador, digite a senha e toque em Entrar. O aparelho fica conectado até alguém tocar em Sair."}, {"t": "Tela inicial", "f": "frames/s03.jpg", "x": "Depois de entrar, escolha a função: Garçom, Cozinha ou Administrador. O garçom pode digitar o nome, que aparece para a cozinha."}, {"t": "Garçom · Mesas", "f": "frames/s04.jpg", "x": "Aqui ficam as mesas. Mesa livre fica tracejada. Toque no número da mesa para começar o pedido."}, {"t": "Garçom · Cardápio", "f": "frames/s05.jpg", "x": "O cardápio aparece com todos os produtos e preços. Use as abas para trocar de categoria e o botão mais para adicionar."}, {"t": "Garçom · Busca rápida", "f": "frames/s06.jpg", "x": "Na busca, digite o nome ou o número do pastel. Por exemplo, 11 encontra o Frango com bacon."}, {"t": "Garçom · Opções", "f": "frames/s07.jpg", "x": "Alguns itens pedem uma escolha. No Muito Louco, escolha Cheddar ou Catupiry."}, {"t": "Garçom · Carrinho", "f": "frames/s08.jpg", "x": "Embaixo aparece quantos itens você escolheu e o valor. Quando terminar, toque em Revisar."}, {"t": "Garçom · Observações", "f": "frames/s09.jpg", "x": "Na revisão, ajuste quantidades e escreva observações, como sem azeitona. Depois toque em Enviar para a cozinha."}, {"t": "Garçom · Mesa aberta", "f": "frames/s10.jpg", "x": "A mesa mostra cada pedido, com o horário e a situação: na fila, preparando, pronto ou entregue. O x tira um item lançado errado."}, {"t": "Garçom · Visão geral", "f": "frames/s11.jpg", "x": "Mesas abertas ficam pretas e mostram o valor e a quantidade de itens. Você pode cuidar de várias mesas ao mesmo tempo."}, {"t": "Cozinha · Pedidos", "f": "frames/s12.jpg", "x": "Na cozinha, cada pedido chega na hora com um bipe. Aparece a mesa, os itens em destaque e as observações. Bebidas ficam com o garçom."}, {"t": "Cozinha · Preparo", "f": "frames/s13.jpg", "x": "Toque em Começar quando for preparar e em Pronto quando sair. Pedidos com mais de 15 minutos ficam marcados."}, {"t": "Garçom · Pedido pronto", "f": "frames/s14.jpg", "x": "O garçom recebe o aviso Prontos para servir, com bipe. Depois de levar à mesa, toque em Entregue."}, {"t": "Conta · Conta inteira", "f": "frames/s15.jpg", "x": "Para fechar a conta, toque em Fechar conta. A taxa de 10% vem desligada; toque no botão para incluir. Escolha a forma de pagamento e, no dinheiro, digite o valor recebido para ver o troco."}, {"t": "Conta · Cada um paga o seu", "f": "frames/s16.jpg", "x": "Em Cada um paga o seu, marque só o que aquela pessoa consumiu e registre o pagamento. O restante continua em aberto na mesa."}, {"t": "Conta · Dividir igual", "f": "frames/s17.jpg", "x": "Em Dividir igual, escolha o número de pessoas. O app mostra o valor de cada parte e você registra uma parte por vez."}, {"t": "Conta · Encerrar mesa", "f": "frames/s18.jpg", "x": "Quando tudo estiver pago, toque em Encerrar mesa e liberar. A venda vai para o caixa e para o balanço."}, {"t": "Garçom · Balcão e viagem", "f": "frames/s19.jpg", "x": "Para pedidos de balcão ou viagem, toque em Balcão ou viagem e dê um nome para a comanda."}, {"t": "Administrador · Senha", "f": "frames/s20.jpg", "x": "A área do administrador pede a senha do administrador. O caixa, o balanço e o cardápio só aparecem para quem tem essa senha."}, {"t": "Administrador · Balanço", "f": "frames/s21.jpg", "x": "No Balanço, escolha Dia, Semana ou Mês. Aparece o total vendido, o número de mesas, o ticket médio e quanto entrou no Pix, no dinheiro e no cartão."}, {"t": "Administrador · Mais vendidos", "f": "frames/s22.jpg", "x": "Logo abaixo, o ranking dos produtos mais vendidos, separado por tipo: pastéis salgados, doces, porções e bebidas."}, {"t": "Administrador · Semana e mês", "f": "frames/s23.jpg", "x": "Use as setas para voltar ou avançar o período. Na semana e no mês aparece também o gráfico de vendas por dia. O botão Copiar resumo leva tudo para o WhatsApp."}, {"t": "Administrador · Cardápio", "f": "frames/s24.jpg", "x": "Na aba Cardápio, altere nomes, preços e descrições direto nos campos. Marque Esgotado para tirar um item de venda temporariamente."}, {"t": "Administrador · Novos produtos", "f": "frames/s25.jpg", "x": "Você pode adicionar produtos e categorias, mudar a ordem e escolher o tipo usado no ranking. No fim, toque em Salvar cardápio."}, {"t": "Administrador · Ajustes", "f": "frames/s26.jpg", "x": "Em Ajustes, troque a senha da equipe ou a do administrador, restaure o cardápio original ou desconecte o aparelho com Sair da conta."}, {"t": "Garçom · Cardápio atualizado", "f": "frames/s27.jpg", "x": "As mudanças aparecem na hora para os garçons: o novo preço já vale e o item esgotado não pode ser pedido."}, {"t": "Encerramento", "f": "frames/s28.jpg", "x": "Dica: no celular, abra o link e use Adicionar à tela inicial para usar como aplicativo. Bom trabalho e boas vendas!"}];
const S=window.speechSynthesis;let vozes=[],i=0,playing=false,tok=0;
const $=s=>document.getElementById(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const dur=x=>Math.max(5,x.split(/\s+/).length/2.4+1.6)*1000;
SC.forEach(s=>{const im=new Image();im.src=s.f});
$('lista').innerHTML=SC.map((s,k)=>`<li><button data-k="${k}"><span>${k+1}</span>${s.t}</button></li>`).join('');
function carregarVozes(){if(!S)return;const vs=S.getVoices();const pt=vs.filter(v=>/^pt/i.test(v.lang));
 vozes=(pt.length?pt:vs).sort((a,b)=>(b.lang==='pt-BR')-(a.lang==='pt-BR'));
 const sel=$('voz'),atual=sel.value;sel.innerHTML=vozes.map((v,k)=>`<option value="${k}">${v.name.replace(/Microsoft |Google /,'')} (${v.lang})</option>`).join('')||'<option>Voz padrão</option>';
 if(atual&&sel.querySelector(`option[value="${atual}"]`))sel.value=atual;
 const pref=vozes.findIndex(v=>/pt-BR/i.test(v.lang)&&/(Francisca|Thalita|Luciana|Google)/i.test(v.name));if(!atual&&pref>=0)sel.value=pref;
 $('aviso').textContent=pt.length?'Narração pronta. Escolha a voz e toque em Iniciar.':'Este aparelho não tem voz em português instalada; será usada a voz disponível.'}
if(S){carregarVozes();S.onvoiceschanged=carregarVozes}else $('aviso').textContent='Este navegador não tem narração por voz. As cenas avançam sozinhas com o texto.';
function show(k){i=Math.max(0,Math.min(SC.length-1,k));const s=SC[i];$('img').src=s.f;$('img').alt=s.t+': '+s.x;$('tit').textContent=s.t;$('txt').textContent=s.x;
 $('prog').style.width=((i+1)/SC.length*100)+'%';document.querySelectorAll('#lista button').forEach(b=>b.classList.toggle('on',+b.dataset.k===i))}
function btn(){$('play').textContent=playing?'⏸ Pausar':(i>0?'▶ Continuar':'▶ Iniciar narração')}
function falar(texto,my){return new Promise(res=>{const partes=texto.match(/[^.!?;:]+[.!?;:]*/g)||[texto];let n=0;
 const prox=()=>{if(my!==tok||n>=partes.length)return res();const u=new SpeechSynthesisUtterance(partes[n++].trim());const v=vozes[+$('voz').value];if(v){u.voice=v;u.lang=v.lang}else u.lang='pt-BR';u.rate=+$('vel').value;
  let ok=false;const seg=setTimeout(()=>{if(!ok){ok=true;prox()}},Math.max(8000,u.text.length*120));u.onend=u.onerror=()=>{if(!ok){ok=true;clearTimeout(seg);prox()}};S.speak(u)};prox()})}
function parar(){tok++;playing=false;try{S&&S.cancel()}catch(e){}btn()}
async function tocar(k){parar();const my=++tok;playing=true;show(k);btn();
 while(my===tok){show(i);
  const t0=Date.now(),min=dur(SC[i].x)*0.6/(+$('vel').value);
  if(S)await falar(SC[i].x,my);if(my!==tok)return;const falta=(S?min:min/0.6)-(Date.now()-t0);if(falta>0)await sleep(falta);
  if(my!==tok)return;await sleep(450);if(i>=SC.length-1)break;i++}
 if(my===tok){playing=false;btn()}}
$('play').onclick=()=>{playing?parar():tocar(i)};
$('prev').onclick=()=>{const w=playing;parar();show(i-1);btn();if(w)tocar(i)};
$('next').onclick=()=>{const w=playing;parar();show(i+1);btn();if(w)tocar(i)};
$('lista').onclick=e=>{const b=e.target.closest('button');if(!b)return;tocar(+b.dataset.k);window.scrollTo({top:0,behavior:'smooth'})};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)parar()});
show(0);btn();
}
</script></body></html>
