<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7b500">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loucos por Pastel">
<title>Loucos por Pastel · Comanda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: balcão de trailer, rápido e barulhento, com a cara do cardápio
   IDEA: a comanda de papel do garçom e o painel de pedidos da chapa
   PICTURE: a onça do logo, faixas de pincel e as fotos do próprio cardápio
   COLOUR and TYPE: amarelo-ouro, preto, vermelho-alaranjado; Anton nos títulos, Oswald no resto
   LAYOUT: uma coluna para o celular, barra de ação fixa embaixo */
:root{color-scheme:light dark;--y:#f7b500;--y2:#ffd23a;--red:#d8431a;--wine:#6e1b0b;--k:#141110;
--bg:light-dark(#f2ede2,#0e0c0b);--card:light-dark(#fff,#1d1815);--ink:light-dark(#1d1612,#f5eee4);
--mut:light-dark(#6f645b,#a99d91);--line:light-dark(#e3d9ca,#342b25);--ok:#2b9a48;--gold:light-dark(#b07d00,#ffc61a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Oswald,"Arial Narrow",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.anton{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.01em}
.money{white-space:nowrap;font-variant-numeric:tabular-nums}
/* topo */
.top{position:sticky;top:0;z-index:20;background:var(--y);color:var(--k);display:flex;align-items:center;gap:10px;padding:8px max(3vw,12px);
 background-image:radial-gradient(rgba(0,0,0,.07) 1px,transparent 1.5px);background-size:5px 5px;box-shadow:0 2px 0 var(--k)}
.top img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 40%;border:2px solid var(--k);background:var(--k)}
.top .t{flex:1;line-height:1}
.top .t b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:21px;color:var(--wine)}
.top .t small{font-size:13px;font-weight:600;text-transform:uppercase}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--k);color:var(--y);white-space:nowrap}
.pill.off{background:var(--red);color:#fff}
.icon-btn{min-width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--k);color:var(--y);padding:0 10px;font-size:14px}
main{max-width:860px;margin:0 auto;padding:14px max(3vw,12px) 120px}
/* pincel */
.brush{display:inline-block;background:var(--red);color:#fff;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:20px;padding:6px 18px 7px 12px;text-transform:uppercase;
 clip-path:polygon(0 12%,4% 0,35% 7%,62% 0,96% 5%,100% 34%,97% 66%,100% 100%,64% 93%,30% 100%,3% 92%,1% 55%)}
.brush.k{background:var(--k);color:var(--y)}
.brush.y{background:var(--y);color:var(--k)}
h1,h2{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(34px,8vw,50px);color:light-dark(var(--wine),var(--y))}
.step button:disabled{opacity:.35}
h2{font-size:26px}
.mut{color:var(--mut)}
/* início */
.hero{background:var(--y);color:var(--k);margin:-14px calc(-1*max(3vw,12px)) 0;padding:28px max(3vw,12px) 34px;text-align:center;position:relative;
 background-image:radial-gradient(rgba(0,0,0,.08) 1px,transparent 1.5px);background-size:5px 5px}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:18px;background:var(--bg);clip-path:polygon(0 40%,6% 10%,13% 45%,22% 5%,31% 50%,40% 15%,52% 55%,61% 10%,72% 45%,83% 8%,92% 48%,100% 20%,100% 100%,0 100%)}
.hero img{width:min(250px,62vw);border-radius:50%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.hero h1{color:var(--wine);margin-top:10px;font-size:clamp(38px,10vw,58px)}
.hero .brush{margin-top:8px;font-size:15px}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:30px}
.role{background:var(--k);color:#fff;border-radius:18px;padding:20px 14px;text-align:left;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 5px 0 var(--red)}
.role b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;color:var(--y);line-height:1}
.role span{font-size:14px;color:#d9cfc4}
.role svg{width:38px;height:38px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:18px;font-weight:600}
input[type=text],input[type=search],input[type=number],input[type=password]{height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;width:100%}
.contact{margin-top:26px;text-align:center;font-size:15px;color:var(--mut)}
.contact b{color:var(--ink)}
/* mesas */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.mesa{position:relative;border-radius:14px;padding:10px 8px;min-height:96px;text-align:center;background:var(--card);border:2px dashed var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px}
.mesa .n{font-family:Anton,Impact,sans-serif;font-size:34px;line-height:1}
.mesa small{font-size:13px;color:var(--mut)}
.mesa.on{background:var(--k);color:#fff;border:2px solid var(--k);box-shadow:0 4px 0 var(--y)}
.mesa.on .n{color:var(--y)}
.mesa.on small{color:#e6dccf}
.mesa .dot{position:absolute;top:-7px;right:-7px;background:var(--ok);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:3px 8px;box-shadow:0 0 0 3px var(--bg)}
.btn{min-height:48px;border-radius:12px;padding:0 18px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-transform:uppercase;letter-spacing:.02em}
.btn.p{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--wine)}
.btn.k{background:var(--k);color:var(--y)}
.btn.y{background:var(--y);color:var(--k);box-shadow:0 4px 0 #a87a00}
.btn.g{background:var(--ok);color:#fff}
.btn.o{border:2px solid var(--line);background:var(--card);color:var(--ink)}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ready{background:var(--ok);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:14px}
.ready h3{margin:0 0 6px;font-size:18px}
.ready .r{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.3)}
.ready .r div{flex:1}
.ready button{background:#fff;color:var(--ok);font-weight:700;border-radius:10px;min-height:44px;padding:0 14px}
/* mesa aberta */
.card{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line);margin-bottom:12px}
.ped{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.ped:first-child{border:0;margin:0;padding:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--mut);margin-bottom:4px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;white-space:nowrap}
.s-novo{background:#fde2d8;color:#9a2a08}.s-preparo{background:#ffeeb3;color:#6b4d00}.s-pronto{background:#cdeed6;color:#16632b}.s-entregue{background:var(--line);color:var(--mut)}
.ln{display:flex;align-items:center;gap:10px;padding:6px 0}
.ln .q{font-weight:700;min-width:30px}
.ln .d{flex:1}
.ln .d small{display:block;color:var(--red);font-size:14px}
.ln .x{width:36px;height:36px;border-radius:8px;color:var(--mut);font-size:20px}
.paid{text-decoration:line-through;color:var(--mut)}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;padding:4px 0}
.tot.big{font-family:Anton,Impact,sans-serif;font-size:30px}
.tot.big .money{color:var(--gold)}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--k);padding:10px max(3vw,12px) calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.actions>*{flex:1;max-width:420px}
/* cardápio */
.cats{position:sticky;top:62px;z-index:10;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:0 calc(-1*max(3vw,12px));padding-inline:max(3vw,12px);scrollbar-width:none}
.cats button{flex:none;min-height:40px;padding:0 14px;border-radius:99px;font-weight:600;background:var(--card);border:2px solid var(--line);font-size:15px}
.cats button.on{background:var(--k);color:var(--y);border-color:var(--k)}
.sec{margin:20px 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec .tag{background:var(--y);color:var(--k);font-weight:700;font-size:13px;padding:3px 10px;border-radius:6px;text-transform:uppercase}
.hero-img{width:100%;height:150px;object-fit:cover;border-radius:14px;margin:6px 0}
.list{background:var(--k);border-radius:14px;padding:4px 12px;color:#fff}
.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed #3d3530}
.it:last-child{border:0}
.it.off{opacity:.45}
.tk.on{border-color:#2b9a48}.tk.on header{background:#2b9a48}.tk.on header b{color:#fff;font-size:20px}.tk.on.novo{animation:pulsa 1.2s infinite}
@keyframes pulsa{50%{box-shadow:0 0 0 6px rgba(43,154,72,.35)}}
@media(prefers-reduced-motion:reduce){.tk.on.novo{animation:none}}
.oc{padding:8px 14px 0;font-size:15px;line-height:1.45}.oc.tot{display:flex;justify-content:space-between;padding-bottom:4px;font-size:16px}
.hr{margin-top:8px}.hr{gap:6px!important}.hr input[type=time]{width:90px;padding:0 4px!important}.hr .mini.chk{min-width:92px!important}
.hr input[type=time],.hr input[type=date]{height:40px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:0 6px;font-size:15px}
.hr input:disabled{opacity:.4}
.adbtn{margin-top:6px;min-height:34px;padding:0 12px;border-radius:99px;border:1.5px solid var(--y);background:transparent;color:var(--y);font-weight:600;font-size:14px;cursor:pointer}
.cl .adbtn{color:var(--gold);border-color:var(--gold);display:block}
.adl{display:block;color:var(--gold)!important;font-size:14px;font-weight:600;text-transform:none}
.adk{display:block;background:#ffeeb3;color:#6b4d00;border-radius:6px;padding:2px 8px;margin-top:4px;font-size:17px}
.adg button small{font-weight:400;opacity:.85}
.it img{width:62px;height:62px;border-radius:10px;object-fit:cover;flex:none}
.it .d{flex:1}
.it .nm{font-weight:600;font-size:17px;text-transform:uppercase;line-height:1.15}
.it .nm i{font-style:normal;color:var(--y);margin-right:4px}
.it .ds{font-size:13px;color:#c9beb2;line-height:1.3;margin-top:2px}
.it .pr{color:var(--y);font-weight:700;font-size:17px}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:44px;height:44px;border-radius:12px;font-size:24px;font-weight:700;background:var(--y);color:var(--k);line-height:1}
.step button.m{background:#3a322d;color:#fff}
.step b{min-width:24px;text-align:center;font-size:18px}
.list.light{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.list.light .it{border-color:var(--line)}
.list.light .step button.m{background:var(--line);color:var(--ink)}
.warn{font-family:Anton,Impact,sans-serif;color:var(--red);font-size:18px;margin-top:6px}
/* sheet */
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(4vw,16px) calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.opts button{min-height:44px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:600}
.opts button.on{background:var(--red);color:#fff;border-color:var(--red)}
.cl{background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line)}
.cl .row{display:flex;align-items:center;gap:10px}
.cl .row .d{flex:1;font-weight:600;text-transform:uppercase}
.cl input{height:42px;margin-top:8px;font-size:16px}
.cl .step button{background:var(--y)}
.cl .step button.m{background:var(--line);color:var(--ink)}
/* conta */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--k);padding:4px;border-radius:14px;margin-bottom:12px}
.seg button{min-height:48px;border-radius:10px;color:#fff;font-weight:600;font-size:14px;line-height:1.1;padding:4px}
.seg button.on{background:var(--y);color:var(--k)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;width:100%;text-align:left;font-weight:600}
.tog .sw{width:54px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog.on{border-color:var(--ok)}.tog.on .sw{background:var(--ok)}.tog.on .sw::after{transform:translateX(24px)}
.big-n{font-family:Anton,Impact,sans-serif;font-size:clamp(44px,13vw,68px);line-height:1;color:var(--gold);text-align:center;margin:8px 0}
.center{text-align:center}
.pay{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:15px;padding:6px 0;border-top:1px dashed var(--line)}
.troco{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end;margin-top:8px}
.troco div b{display:block;font-family:Anton,Impact,sans-serif;font-size:28px;font-weight:400;color:var(--ok)}
/* cozinha */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tk{background:var(--card);border-radius:16px;overflow:hidden;border:2px solid var(--line);display:flex;flex-direction:column}
.tk header{background:var(--k);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tk header b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:28px;color:var(--y);line-height:1}
.tk header span{font-size:14px;text-align:right;line-height:1.2}
.tk.preparo{border-color:var(--y)}.tk.preparo header{background:var(--y);color:var(--k)}.tk.preparo header b{color:var(--k)}
.tk.late header span{color:#ff9b7d;font-weight:700}
.tk.preparo.late header span{color:#9a2a08}
.tk ul{list-style:none;margin:0;padding:8px 14px;flex:1}
.tk li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:19px;font-weight:600;text-transform:uppercase;line-height:1.2}
.tk li:last-child{border:0}
.tk li i{font-style:normal;background:var(--red);color:#fff;border-radius:6px;padding:0 7px;margin-right:6px}
.tk li small{display:block;text-transform:none;color:var(--red);font-size:16px;font-weight:700}
.tk .bev{font-size:14px;color:var(--mut);padding:0 14px 8px}
.tk footer{padding:10px 14px 14px;display:flex;gap:8px}
.tk footer .btn{flex:1}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}
.empty img{width:120px;border-radius:50%;opacity:.85;filter:grayscale(.3)}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:60;background:var(--k);color:var(--y);padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:92vw;animation:pop .25s ease-out}
@keyframes pop{from{transform:translate(-50%,-10px);opacity:0}}
@media(prefers-reduced-motion:reduce){.toast{animation:none}.tog .sw,.tog .sw::after{transition:none}}
.ed .row{display:flex;gap:6px;align-items:center}
.ed .row:has(.mini){flex-wrap:wrap;gap:10px}
.ed input[type=text]{height:42px;font-size:15px;padding:0 10px;border-radius:10px}
.ed .icon-btn{min-width:40px;height:40px;padding:0}.ed .icon-btn:disabled{opacity:.3}
.eit{border-top:1px dashed var(--line);padding:8px 0;margin-top:8px;display:grid;gap:6px}
.eit.off{opacity:.55}
.eit .preco{width:86px;flex:none;text-align:right}.eit .rs{color:var(--mut);font-size:14px}
.eit .desc{font-size:14px!important;height:38px!important}
.eit .x{width:40px;height:40px;border-radius:10px;color:var(--red);font-size:18px;flex:none}
input.bad{border-color:var(--red)!important}
.mini{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:2px}
.mini select{height:40px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:0 8px;font-size:15px}
.mini.chk{flex-direction:row;align-items:center;gap:6px;white-space:nowrap;font-size:14px;color:var(--ink)}
.mini.chk input{width:22px;height:22px;accent-color:var(--red)}
.hb{margin-top:10px}.hl{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.track{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}.track i{display:block;height:100%;border-radius:99px;background:var(--y)}
.rk{display:flex;gap:10px;align-items:center;padding:6px 0}.pos{font-family:Anton,Impact,sans-serif;font-size:20px;min-width:34px;color:var(--mut)}.pos.p1{color:var(--red)}
.cols{display:flex;gap:3px;align-items:flex-end;height:140px;margin-top:10px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.col i{width:100%;max-width:34px;background:var(--red);border-radius:4px 4px 0 0;min-height:2px}
.col small{font-size:11px;color:var(--mut)}
.note{font-size:13px;color:var(--mut);margin-top:8px}
@media(max-width:600px){.top .t b{font-size:17px}.top{gap:8px}.top img{width:40px;height:40px}}
.top .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty img{aspect-ratio:1;object-fit:cover}
</style>
<script src="config.js"></script>
<script src="img.js"></script>
<script src="menu.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"><p class="mut">Carregando…</p></main>
<div id="foot"></div>
<div id="layer"></div>
<script>
{
const IMG=window.IMG||{};

setMenu(defaultMenu());
const FORMAS=['Dinheiro','Pix','Débito','Crédito'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(Math.round(v*100)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const r2=v=>Math.round(v*100)/100;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const hm=t=>new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const mesaKey=n=>'m-'+String(n).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').slice(0,40);
const LS={get(k,d){try{const v=localStorage.getItem('lpp-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('lpp-'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- dados: compartilhado (db) ou local ---------- */
const COLS=['pedidos','mesas','pagamentos','fechamentos','online'];
const D={mode:'wait',db:null,data:{pedidos:{},mesas:{},pagamentos:{},fechamentos:{},online:{}},chain:{}};
let bc=null;
function localLoad(){const s=LS.get('db',null);if(s)COLS.forEach(c=>D.data[c]=s[c]||{})}
function localSave(){LS.set('db',D.data);try{bc&&bc.postMessage(1)}catch(e){}}
function startLocal(){D.mode='local';localLoad();try{bc=new BroadcastChannel('lpp');bc.onmessage=()=>{localLoad();onData()}}catch(e){}onData()}
function startRemote(db){
 D.mode='remote';D.db=db;let first=true;
 const t=setTimeout(()=>{if(first){toast('Sem conexão com os dados ainda. Verifique a internet.')}},10000);
 const q={pedidos:db.collection('pedidos').orderBy('em','desc').limit(500),mesas:db.collection('mesas'),pagamentos:db.collection('pagamentos').orderBy('em','desc').limit(500),online:db.collection('online').orderBy('em','desc').limit(200)};
 /* fechamentos (caixa) não são carregados aqui: só o administrador consulta, pelo Balanço */
 ['pedidos','mesas','pagamentos','online'].forEach(c=>q[c].onSnapshot(s=>{const m={};s.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});D.data[c]=m;if(first&&!s.metadata.fromCache){first=false;clearTimeout(t)}onData(c)},e=>{clearTimeout(t);if(c==='online')return;toast(e&&e.code==='revoked'?'Acesso aos dados encerrado.':'Erro ao ler os dados ('+(e&&e.code||'?')+').')}));
}
function write(col,id,fn){
 const key=col+'/'+id;
 const p=(D.chain[key]||Promise.resolve()).then(async()=>{
  if(D.mode==='remote'){const ref=D.db.collection(col).doc(id);
   if(fn===null)await ref.delete();else await ref.set(fn)}
  else{if(fn===null)delete D.data[col][id];else D.data[col][id]=JSON.parse(JSON.stringify(fn));localSave();onData(col)}
 }).catch(e=>{const c=e&&e.code;toast(c==='invalid_argument'?'Sem permissão para salvar no banco de dados.':c==='quota_exceeded'?'Banco de dados cheio: encerre mesas antigas.':'Não salvou, tente de novo.')});
 D.chain[key]=p;return p;
}
const put=(c,id,o)=>write(c,id,o),del=(c,id)=>write(c,id,null);

 conta:{modo:'total',serv:false,sel:{},n:2,pagas:{},forma:'Dinheiro',rec:''}};

function beep(seq){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime;seq.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='square';g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.24);t+=.26})}catch(e){}try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
function unlock(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}}
let tt=null;function toast(m){const l=document.createElement('div');l.className='toast';l.textContent=m;document.body.appendChild(l);clearTimeout(tt);document.querySelectorAll('.toast').forEach(x=>{if(x!==l)x.remove()});tt=setTimeout(()=>l.remove(),3500)}

function onData(){
 const cd=D.data.mesas[CFG_MENU],js=cd&&cd.json||null;if(js!==menuJson){menuJson=js;try{setMenu(js?JSON.parse(js):defaultMenu())}catch(e){setMenu(defaultMenu())}if(st.role==='admin'&&st.view==='menu'&&!st.draftDirty)st.draft=null}
 const ps=Object.entries(D.data.pedidos);
 const novos=new Set(ps.filter(([,p])=>p.st==='novo').map(([k])=>k)),prontos=new Set(ps.filter(([,p])=>p.st==='pronto').map(([k])=>k));
 if(seenPed&&st.role==='cozinha'&&[...novos].some(k=>!seenPed.has(k))){beep([880,1175,880]);toast('Novo pedido chegou!')}
 if(seenPronto&&st.role==='garcom'&&[...prontos].some(k=>!seenPronto.has(k))){beep([660,990]);toast('Pedido pronto para servir!')}
 const ativos=new Map(ps.filter(([,p])=>p.st==='novo'||p.st==='preparo').map(([k,p])=>[k,p.mesa]));
 if(seenAtivos&&st.role==='cozinha'){for(const[k,ms]of seenAtivos)if(!D.data.pedidos[k]){beep([440,330]);toast('Pedido cancelado: '+nomeMesa(ms))}}
 if(D.mode!=='wait'){seenPed=novos;seenPronto=prontos;seenAtivos=ativos}
 softRender();
}

/* ---------- cálculos da mesa ---------- */
function mesaDoc(k){return D.data.mesas[k]}
function abertas(){return Object.entries(D.data.mesas).filter(([k,m])=>m.aberta&&k[0]!=='_')}
function pedidosMesa(k){const m=mesaDoc(k);if(!m||!m.aberta)return[];return Object.entries(D.data.pedidos).filter(([,p])=>p.mesa===k&&p.sessao===m.sessao).sort((a,b)=>a[1].em-b[1].em)}
function pagsMesa(k){const m=mesaDoc(k);if(!m)return[];return Object.entries(D.data.pagamentos).filter(([,p])=>p.mesa===k&&p.sessao===m.sessao).sort((a,b)=>a[1].em-b[1].em)}
function resumo(k){
 const peds=pedidosMesa(k),pags=pagsMesa(k),pago={};
 pags.forEach(([,p])=>(p.itens||[]).forEach(u=>{const kk=u.pid+':'+u.i;pago[kk]=(pago[kk]||0)+u.q}));
 let total=0;const units=[];// linhas com quantidade restante
 peds.forEach(([pid,p])=>p.itens.forEach((it,i)=>{total+=it.p*it.q;const pg=Math.min(pago[pid+':'+i]||0,it.q);units.push({pid,i,it,pago:pg,rest:it.q-pg,st:p.st})}));
 const base=pags.reduce((s,[,p])=>s+(p.base||0),0),serv=pags.reduce((s,[,p])=>s+(p.serv||0),0);
 return{peds,pags,units,total:r2(total),pagoBase:r2(base),pagoServ:r2(serv),resta:r2(Math.max(0,total-base)),qtd:units.reduce((s,u)=>s+u.it.q,0)};
}
function grupos(units){const g={};units.forEach(u=>{if(u.rest<=0)return;const k=u.it.id+'|'+(u.it.o||'')+'|'+adKey(u.it.ad);(g[k]=g[k]||{k,it:u.it,rest:0,src:[]});g[k].rest+=u.rest;g[k].src.push(u)});return Object.values(g)}

async function encerrar(){

 if(r.total>0)await put('fechamentos',uid(),{mesa:k,nome:m.nome,base:r.pagoBase,serv:r.pagoServ,consumo:r.total,formas,itens:Object.values(ag),dia:hoje(),em:Date.now()});

const CFG_MENU='_cardapio',CFG_ADM='_admin';
async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('lpp:'+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of 'lpp:'+t)h=(h*31+c.charCodeAt(0))|0;return'x'+h}}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pdate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DSEM=['dom','seg','ter','qua','qui','sex','sáb'];
function periodo(per,ref){const d=pdate(ref);
 if(per==='dia')return{a:ref,b:ref,lbl:DSEM[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
 if(per==='semana'){const s=new Date(d);s.setDate(d.getDate()-((d.getDay()+6)%7));const e=new Date(s);e.setDate(s.getDate()+6);return{a:ymd(s),b:ymd(e),lbl:pad(s.getDate())+'/'+pad(s.getMonth()+1)+' a '+pad(e.getDate())+'/'+pad(e.getMonth()+1)+'/'+e.getFullYear()}}
 const s=new Date(d.getFullYear(),d.getMonth(),1),e=new Date(d.getFullYear(),d.getMonth()+1,0);return{a:ymd(s),b:ymd(e),lbl:MESES[d.getMonth()]+' de '+d.getFullYear()};
}
function mover(per,ref,dir){const d=pdate(ref);if(per==='dia')d.setDate(d.getDate()+dir);else if(per==='semana')d.setDate(d.getDate()+7*dir);else{d.setDate(1);d.setMonth(d.getMonth()+dir)}return ymd(d)}
async function carregarBal(){
 const B=st.bal;if(!B.ref)B.ref=hoje();const{a,b}=periodo(B.per,B.ref),key=a+'|'+b;if(B.key===key&&B.rows&&Date.now()-(B.at||0)<30000)return;const novo=B.key!==key;B.key=key;B.at=Date.now();if(novo){B.rows=null;B.err=null}
 try{let rows;
  if(D.mode==='remote'){const s=await D.db.collection('fechamentos').where('dia','>=',a).where('dia','<=',b).get();rows=s.docs.filter(d=>d.exists).map(d=>d.data())}
  else rows=Object.values(D.data.fechamentos).filter(f=>f.dia>=a&&f.dia<=b);
  if(B.key===key){B.rows=rows;render()}
 }catch(e){if(B.key===key){B.err='Não foi possível carregar ('+(e&&e.code||'erro')+').';B.rows=[];render()}}
}
function calcBal(rows){
 const t={total:0,base:0,serv:0,consumo:0,n:rows.length,f:{Pix:0,Dinheiro:0,'Débito':0,'Crédito':0},dias:{},tipos:{},semItens:0,online:0,nOnline:0,taxa:0};
 rows.forEach(f=>{const v=(f.base||0)+(f.serv||0);if(f.canal==='online'){t.online+=v;t.nOnline++;t.taxa+=f.taxa||0}t.total+=v;t.base+=f.base||0;t.serv+=f.serv||0;t.consumo+=f.consumo||0;t.dias[f.dia]=(t.dias[f.dia]||0)+v;
  Object.entries(f.formas||{}).forEach(([k,x])=>t.f[k]=(t.f[k]||0)+x);
  if(!f.itens)t.semItens++;(f.itens||[]).forEach(i=>{const T=t.tipos[i.t||'Outros']=t.tipos[i.t||'Outros']||{};const it=T[i.id]=T[i.id]||{n:i.n,q:0,v:0};it.q+=i.q;it.v+=i.v;it.n=i.n})});
 return t;
}

 let h=`<div class="opts" style="margin-top:0">${[['dia','Dia'],['semana','Semana'],['mes','Mês']].map(([v,l])=>`<button class="${B.per===v?'on':''}" data-a="bper" data-v="${v}">${l}</button>`).join('')}</div>
 <div class="bar"><button class="icon-btn" data-a="bnav" data-v="-1" aria-label="Período anterior">‹</button><b style="text-align:center;flex:1;font-size:18px;text-transform:capitalize">${esc(P.lbl)}</b><button class="icon-btn" data-a="bnav" data-v="1" aria-label="Próximo período">›</button></div>

 const cartao=t.f['Débito']+t.f['Crédito'],formas=[['Pix',t.f.Pix,'#00a88f'],['Dinheiro',t.f.Dinheiro,'#2b9a48'],['Cartão',cartao,'#d8431a']],mx=Math.max(...formas.map(f=>f[1]),1);
 const aberto=r2(t.consumo-t.base);
 h+=`<div class="card center" style="margin-top:12px"><div class="mut">Total vendido</div><div class="big-n money">${brl(t.total)}</div>
 <div class="mut">${t.n} venda${t.n>1?'s':''} (mesas e online) · ticket médio ${brl(t.total/t.n)}${t.serv?` · inclui ${brl(t.serv)} de serviço`:''}</div>
 ${aberto>0.004?`<div style="color:var(--red);font-weight:600;margin-top:6px">${brl(aberto)} encerrado sem receber</div>`:''}</div>
 <div class="card"><b>Formas de pagamento</b>${formas.map(([n,v,c])=>`<div class="hb"><div class="hl"><span>${n}</span><span class="money"><b>${brl(v)}</b> <small class="mut">${t.total?Math.round(v/t.total*100):0}%</small></span></div><div class="track"><i style="width:${v/mx*100}%;background:${c}"></i></div></div>`).join('')}
 ${cartao?`<p class="note">Cartão: débito ${brl(t.f['Débito'])} · crédito ${brl(t.f['Crédito'])}</p>`:''}</div>`;
 if(t.nOnline)h+=`<div class="card"><b>Salão e online</b><div class="hb"><div class="hl"><span>Salão</span><span class="money"><b>${brl(t.total-t.online)}</b></span></div></div><div class="hb"><div class="hl"><span>Online (${t.nOnline} pedido${t.nOnline>1?'s':''})</span><span class="money"><b>${brl(t.online)}</b></span></div></div>${t.taxa?`<p class="note">Inclui ${brl(t.taxa)} de taxas de entrega.</p>`:''}</div>`;
 if(B.per!=='dia'){const{a,b}=P;const ds=[];for(let d=pdate(a);ymd(d)<=b;d.setDate(d.getDate()+1))ds.push(ymd(d));const mxd=Math.max(...ds.map(d=>t.dias[d]||0),1);
  h+=`<div class="card"><b>Vendas por dia</b><div class="cols">${ds.map(d=>{const v=t.dias[d]||0,dt=pdate(d);return`<div class="col" title="${pad(dt.getDate())}/${pad(dt.getMonth()+1)}: ${brl(v)}"><i style="height:${v/mxd*100}%"></i><small>${B.per==='semana'?DSEM[dt.getDay()]:dt.getDate()}</small></div>`}).join('')}</div>
  <p class="note">Melhor dia: ${(()=>{const m=ds.reduce((x,d)=>(t.dias[d]||0)>(t.dias[x]||0)?d:x,ds[0]);const dt=pdate(m);return pad(dt.getDate())+'/'+pad(dt.getMonth()+1)+' · '+brl(t.dias[m]||0)})()}</p></div>`}
 const ordem=[...TIPOS,...Object.keys(t.tipos).filter(x=>!TIPOS.includes(x))].filter(x=>t.tipos[x]);
 h+=`<div class="sec"><span class="brush">Mais vendidos</span></div>`;
 h+=ordem.map(tp=>{const its=Object.values(t.tipos[tp]).sort((a,b)=>b.q-a.q||b.v-a.v),mq=its[0].q,tq=its.reduce((s,i)=>s+i.q,0),tv=its.reduce((s,i)=>s+i.v,0);
  return`<div class="card"><div class="hl" style="margin-bottom:6px"><b style="font-size:18px">${esc(tp)}</b><span class="mut">${tq} un · ${brl(tv)}</span></div>${its.map((i,ix)=>`<div class="rk"><span class="pos${ix<3?' p1':''}">${ix+1}º</span><div class="hb" style="flex:1;margin:0"><div class="hl"><span>${esc(i.n)}</span><span class="money"><b>${i.q}</b> un · ${brl(i.v)}</span></div><div class="track"><i style="width:${i.q/mq*100}%"></i></div></div></div>`).join('')}</div>`}).join('')||'<p class="mut">Sem detalhe de produtos neste período.</p>';
 if(t.semItens)h+=`<p class="note">${t.semItens} mesa${t.semItens>1?'s':''} encerrada${t.semItens>1?'s':''} antes desta atualização entra${t.semItens>1?'m':''} no total, mas sem detalhe de produtos.</p>`;
 h+=`<button class="btn k w" data-a="bcopiar" style="margin-top:8px">Copiar resumo</button>`;
 return h;
}
function resumoTexto(){const B=st.bal,P=periodo(B.per,B.ref),t=calcBal(B.rows||[]);
 let s=`*Loucos por Pastel · Balanço*\n${P.lbl}\nTotal: ${brl(t.total)} (${t.n} mesas)\nPix: ${brl(t.f.Pix)}\nDinheiro: ${brl(t.f.Dinheiro)}\nCartão: ${brl(t.f['Débito']+t.f['Crédito'])}\n`;
 Object.entries(t.tipos).forEach(([tp,o])=>{s+=`\n*${tp}*\n`+Object.values(o).sort((a,b)=>b.q-a.q).slice(0,5).map((i,ix)=>`${ix+1}. ${i.n}: ${i.q} un`).join('\n')+'\n'});return s}

/* ---------- cancelamentos e limpeza ---------- */
async function apagarColecao(col,filtro){let n=0;
 if(D.mode==='remote'){const s=await D.db.collection(col).get();for(const d of s.docs){if(!d.exists||(filtro&&!filtro(d.id)))continue;await D.db.collection(col).doc(d.id).delete();n++}}
 else{for(const id of Object.keys(D.data[col]||{})){if(filtro&&!filtro(id))continue;delete D.data[col][id];n++}localSave();onData()}
 return n}

  confirmar('Cancelar '+nomeMesa(k)+'?',(r.pags.length?'Os '+r.pags.length+' pagamentos já registrados também serão apagados. ':'')+'Todos os pedidos saem da conta e da cozinha, e a mesa fica livre. Nada entra no caixa.','Cancelar mesa',async()=>{
   for(const[id]of r.peds)await del('pedidos',id);for(const[id]of r.pags)await del('pagamentos',id);

function cardOnline(k,o,quem){
 const min=Math.floor((Date.now()-o.em)/60000);
 const itens=o.itens.map(i=>`<li><i>${i.q}×</i>${esc(i.n)}${i.ad&&i.ad.length?`<b class="adk">${esc(adTxt(i.ad))}</b>`:''}${i.o?`<small>⚠ ${esc(i.o)}</small>`:''}</li>`).join('');
 let bt='';
 if(o.st==='novo')bt=`<button class="btn p" data-a="onrec" data-k="${k}" style="flex:.6">Recusar</button><button class="btn g" data-a="onst" data-k="${k}" data-v="producao">Aceitar</button>`;
 else if(o.st==='producao')bt=quem==='cozinha'?`<button class="btn g" data-a="onst" data-k="${k}" data-v="pronto">Pronto ✓</button>`:'';
 if(o.tipo==='entrega'&&(o.st==='pronto'||(o.st==='producao'&&quem==='garcom')))bt+=`<button class="btn y" data-a="onst" data-k="${k}" data-v="saiu">Saiu para entrega</button>`;
 if(quem==='garcom'&&['pronto','saiu','producao'].includes(o.st))bt+=`<button class="btn k" data-a="onconc" data-k="${k}">Concluir (pago)</button>`;
 return`<article class="tk on ${o.st}"><header><b>ONLINE · ${esc(TIPO_TXT[o.tipo]||'')}</b><span>${hm(o.em)} · há ${min} min<br>${esc(ON_ST[o.st])}</span></header>
 <div class="oc"><b>${esc(o.cli.nome)}</b> · ${telFmt(o.cli.tel)}<br>${o.tipo==='entrega'?'📍 '+esc(endTxt(o.end||o.cli.end)):'🕒 '+(o.tipo==='local'?'Chega às ':'Retira às ')+esc(o.hora||'')}<br>💳 ${esc(pagTxt(o))}${o.obs?`<br>⚠ ${esc(o.obs)}`:''}</div>
 <ul>${itens}</ul><div class="oc tot"><span>Total${o.taxa?` (inclui entrega ${brl(o.taxa)})`:''}</span><b class="money">${brl(o.total)}</b></div>
 <footer style="flex-wrap:wrap">${bt}<button class="btn o" data-a="onwa" data-k="${k}" style="color:#1f8f4c;border-color:#1f8f4c">💬 WhatsApp</button></footer></article>`;
}

function vozPedido(){try{const S=window.speechSynthesis;if(!S)return false;const vs=S.getVoices().filter(v=>/^pt/i.test(v.lang));if(!vs.length)return false;
 const MASC=/(Daniel|Felipe|Antonio|Ant[oô]nio|Fabio|F[aá]bio|Ricardo|Rodrigo|Julio|Humberto|Donato|Valerio|Nicolau|male|ptd)/i;const v=vs.find(x=>MASC.test(x.name+' '+x.voiceURI))||vs.find(x=>/pt-BR/i.test(x.lang))||vs[0];
 S.cancel();const u=new SpeechSynthesisUtterance('Pedido online!');u.voice=v;u.lang=v.lang;u.rate=1;S.speak(u);return true}catch(e){return false}}
setInterval(()=>{if(st.role!=='cozinha'||!st.somOk)return;if(onlineAtivos().some(([,o])=>o.st==='novo')){if(!vozPedido())beep([988,740,988,740])}},6000);

 const ag={};o.itens.forEach(it=>{const I=ITEM[it.id];const a=ag[it.id]=ag[it.id]||{id:it.id,n:I?.n||it.n,t:I?.tipo||'Outros',q:0,v:0};a.q+=it.q;a.v=r2(a.v+(it.pb??it.p)*it.q);(it.ad||[]).forEach(x=>{const b=ag['ad:'+x.n]=ag['ad:'+x.n]||{id:'ad:'+x.n,n:x.n,t:'Adicionais',q:0,v:0};b.q+=it.q;b.v=r2(b.v+x.p*it.q)})});
 if(o.taxa){ag['taxa']={id:'taxa',n:'Taxa de entrega',t:'Entregas',q:1,v:o.taxa}}
 const forma={'Cartão de crédito':'Crédito','Cartão de débito':'Débito'}[o.pag?.forma]||o.pag?.forma||'Dinheiro';
 await put('fechamentos',uid(),{canal:'online',mesa:'online',nome:'Online · '+o.cli.nome,base:o.total,serv:0,consumo:o.total,taxa:o.taxa||0,formas:{[forma]:o.total},itens:Object.values(ag),dia:hoje(),em:Date.now()});
 await put('online',k,{...o,st:'concluido',fim:Date.now()});toast('Pedido de '+o.cli.nome+' concluído e lançado no caixa.')}

 emodo:(b,v)=>{const H=hdraft();if(!H.semEntrega)return;H.semEntrega.d=v==='sempre'?'sempre':hoje();st.hdirty=true;render()},
 hfadd:()=>{const H=hdraft();(H.fechados=H.fechados||[]).push({d:hoje(),msg:''});st.hdirty=true;render()},
 hfdel:b=>{hdraft().fechados.splice(+b.dataset.i,1);st.hdirty=true;render()},
 hsalvar:async()=>{const H=hdraft();for(const d of H.sem)if(d.on&&(!d.a||!d.f))return toast('Preencha os horários dos dias abertos.');H.fechados=(H.fechados||[]).filter(f=>f.d).sort((a,b)=>a.d<b.d?-1:1);
  const hj=hoje();H.fechados=H.fechados.filter(f=>f.d>=hj);await put('mesas',CFG_HOR,JSON.parse(JSON.stringify(H)));st.hdirty=false;st.hdraft=null;toast('Horários salvos. O link dos clientes já mostra a mudança.');render()},
 copylink:async(b,v)=>{const S=lojaStatus(horario());const t=`🥟 *Loucos por Pastel* — faça seu pedido pelo link:\n${v}\nEntrega (taxa de ${brl(TAXA_ENTREGA)}), retirada ou para comer aqui!`;try{await navigator.clipboard.writeText(t);toast('Mensagem copiada. Cole no WhatsApp.')}catch(e){toast('Não foi possível copiar neste aparelho.')}},
});
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
 const a=b.dataset.a,v=b.dataset.v,C=st.conta;
 if(ADM[a]){await ADM[a](b,v,e);return}
 if(a==='ovl'){if(e.target===b){st.sheet=null;renderSheet()}return}
 switch(a){
 case'role':st.role=v;LS.set('role',v);const ni=$('#nome');if(ni){st.nome=ni.value.trim();LS.set('nome',st.nome)}unlock();st.view='mesas';if(v==='garcom')setTimeout(limpar,3000);break;
 case'trocar':st.admin=false;st.draft=null;st.draftDirty=false;st.role=null;LS.set('role',null);st.view='mesas';st.cart=[];break;
 case'som':unlock();beep([880,1175,880]);return;
 case'home':st.view='mesas';st.mesa=null;break;
 case'mesa':st.mesa=mesaKey(v);st.mesaNome=v;st.view=resumo(st.mesa).peds.length?'mesa':'cardapio';st.cart=[];st.cat='trad';st.q='';break;
 case'vmesa':st.view='mesa';break;
 case'add':st.view='cardapio';st.cart=[];st.q='';break;
 case'voltar':st.view=resumo(st.mesa).peds.length?'mesa':'mesas';st.cart=[];break;
 case'cat':st.cat=v;st.q='';const bu=$('#busca');if(bu)bu.value='';$('#lista').innerHTML=vLista();document.querySelectorAll('#cats button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  const s=document.getElementById('c-'+v);if(s)window.scrollTo({top:s.getBoundingClientRect().top+scrollY-130,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});return;
 case'mais':if(ITEM[v].opts){st.sheet={t:'ad',id:v,sel:[],opt:null,edit:null};renderSheet();return}addCart(v);refreshLista();return;
 case'menos':{const ls=st.cart.filter(c=>c.id===v);const l=ls[ls.length-1];if(l){l.q--;if(l.q<=0)st.cart.splice(st.cart.indexOf(l),1)}refreshLista();return}
 case'optok':addCart(st.sheet.id,'Com '+v.toLowerCase());st.sheet=null;renderSheet();refreshLista();return;
 case'revisar':st.sheet={t:'rev'};renderSheet();return;
 case'cm':case'cp':{const i=+b.dataset.i;st.cart[i].q+=a==='cp'?1:-1;if(st.cart[i].q<=0)st.cart.splice(i,1);if(!st.cart.length)st.sheet=null;render();return}
 case'enviar':b.disabled=true;await enviar();return;
 case'fechar':st.sheet=null;renderSheet();return;
 case'sim':{const f=confirmFn;confirmFn=null;st.sheet=null;renderSheet();if(f)await f();return}
 case'rmitem':{const p=D.data.pedidos[b.dataset.k],i=+b.dataset.i,it=p.itens[i];
  confirmar('Tirar 1× '+(ITEM[it.id]?.n||it.n)+'?','O item sai da conta'+(p.cozinha&&p.st!=='entregue'?' e da tela da cozinha.':'.'),'Tirar',async()=>{const np=JSON.parse(JSON.stringify(D.data.pedidos[b.dataset.k]));np.itens[i].q--;if(np.itens[i].q<=0)np.itens.splice(i,1);
   if(!np.itens.length)await del('pedidos',b.dataset.k);else await put('pedidos',b.dataset.k,np)});return}
 case'entregue':{const p=D.data.pedidos[b.dataset.k];if(p)await put('pedidos',b.dataset.k,{...p,st:'entregue'});return}
 case'kst':{const p=D.data.pedidos[b.dataset.k];if(p){await put('pedidos',b.dataset.k,{...p,st:v});if(v==='pronto')toast('Garçom avisado: '+nomeMesa(p.mesa))}return}
 case'conta':st.view='conta';C.sel={};C.rec='';break;
 case'modo':C.modo=v;C.sel={};break;
 case'serv':C.serv=!C.serv;break;
 case'forma':C.forma=v;break;
 case'selp':case'selm':C.sel[v]=Math.max(0,(C.sel[v]||0)+(a==='selp'?1:-1));break;
 case'nmais':C.n++;break;
 case'nmenos':C.n=Math.max(2,(C.pagas[st.mesa]||0)+1,C.n-1);break;
 case'pagtotal':{const r=resumo(st.mesa);const its=r.units.filter(u=>u.rest>0).map(u=>({pid:u.pid,i:u.i,q:u.rest}));b.disabled=true;await registrar(r.resta,its,'conta inteira');break}
 case'pagind':{const r=resumo(st.mesa),gs=grupos(r.units);let base=0;const its=[];
  gs.forEach(g=>{let n=Math.min(C.sel[g.k]||0,g.rest);base+=n*g.it.p;for(const u of g.src){if(!n)break;const t=Math.min(n,u.rest);its.push({pid:u.pid,i:u.i,q:t});n-=t}});
  if(base>r.resta+.004)base=r.resta;b.disabled=true;await registrar(base,its,'itens de uma pessoa');break}
 case'pagparte':{const r=resumo(st.mesa),pg=C.pagas[st.mesa]||0,n=Math.max(C.n,pg+1);b.disabled=true;await registrar(r.resta/(n-pg),[],'parte '+(pg+1)+' de '+n);C.pagas[st.mesa]=pg+1;C.n=n;break}
 case'rmpag':confirmar('Desfazer pagamento?','O valor volta a ficar em aberto na mesa.','Desfazer',async()=>{await del('pagamentos',b.dataset.k);if(C.pagas[st.mesa])C.pagas[st.mesa]--});return;
 case'encerrar':{const r=resumo(st.mesa);if(r.resta>0.004)confirmar('Encerrar com saldo?','Ainda faltam '+brl(r.resta)+'. A mesa será liberada mesmo assim.','Encerrar',encerrar);else{b.disabled=true;await encerrar()}return}
 case'avulsa':st.sheet={t:'avulsa'};renderSheet();setTimeout(()=>$('#avn')?.focus(),50);return;
 case'avok':{const n=($('#avn')?.value||'').trim();if(!n){toast('Digite um nome.');return}st.sheet=null;st.mesa=mesaKey(n);st.mesaNome=n;st.view=resumo(st.mesa).peds.length?'mesa':'cardapio';st.cart=[];break}
 case'caixa':st.sheet={t:'caixa'};renderSheet();return;
 case'nmesas':st.sheet={t:'nm'};renderSheet();return;
 case'nm+':case'nm-':st.nm=Math.min(60,Math.max(1,st.nm+(a==='nm+'?1:-1)));LS.set('nm',st.nm);break;
 }
 render();if(['home','mesa','add','conta','vmesa','avok','role','trocar'].includes(a))window.scrollTo(0,0);
});
function refreshLista(){const l=$('#lista');if(l)l.innerHTML=vLista();const n=st.cart.reduce((s,c)=>s+c.q,0),v=st.cart.reduce((s,c)=>s+c.q*linePrice(c),0);const bt=document.querySelector('[data-a="revisar"]');if(bt){bt.disabled=!n;bt.innerHTML='Revisar '+(n?n+' ite'+(n>1?'ns':'m')+' · <span class="money">'+brl(v)+'</span>':'pedido')}}
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.ed){edInput(t);return}
 if(t.dataset.hd){hdInput(t);return}
 if(t.id==='bdata'&&t.value){st.bal.ref=t.value;render();return}
 if(t.id==='busca'){st.q=t.value;$('#lista').innerHTML=vLista();document.querySelectorAll('#cats button').forEach(x=>x.classList.toggle('on',!st.q&&x.dataset.v===st.cat))}
 if(t.dataset.obs!==undefined){const c=st.cart[+t.dataset.obs];if(c)c.o=t.value}
 if(t.id==='rec'){st.conta.rec=t.value;const s=$('#troco');if(s)s.textContent=troco(st._valor||0)}
 if(t.id==='nome'){st.nome=t.value.trim();LS.set('nome',st.nome)}
});
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirty&&!(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.keep!==undefined))render()},0));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.sheet){st.sheet=null;renderSheet()}if(e.key==='Enter'&&e.target.id==='lsenha')document.querySelector('[data-a="login"]')?.click();if(e.key==='Enter'&&e.target.id==='asenha')document.querySelector('[data-a="aloginok"]')?.click();if(e.key==='Enter'&&(e.target.id==='pin1'||e.target.id==='pin2'))document.querySelector('[data-a="pinok"]')?.click();if(e.key==='Enter'&&e.target.id==='avn')document.querySelector('[data-a="avok"]')?.click()});
setInterval(()=>{if(st.role==='cozinha'&&!st.sheet)softRender()},30000);

render();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
(async()=>{let db=null;const cfg=window.FIREBASE_CONFIG;if(cfg&&cfg.apiKey&&window.firebase){try{firebase.initializeApp(cfg);db=firebase.firestore();try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}}catch(e){db=null}}
 if(db&&window.AUTH_ON&&firebase.auth){AUTH.on=true;let uidAtual;
  try{firebase.auth().getRedirectResult().then(r=>{if(r&&r.user&&!DONOS.includes(String(r.user.email).toLowerCase())){toast('Esta conta do Google não tem acesso.');firebase.auth().signOut()}}).catch(()=>{})}catch(e){}
  firebase.auth().onAuthStateChanged(u=>{const antes=uidAtual;uidAtual=u?u.uid:null;AUTH.user=u;AUTH.ready=true;
   if(!u&&antes){location.reload();return}
   if(u&&D.mode!=='remote')startRemote(db);render()});
  render();return}
 if(!db){try{if(window.claude&&claude.use)db=await claude.use('db')}catch(e){}}if(db)startRemote(db);else startLocal()})();
}
